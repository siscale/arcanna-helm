# arcanna-rag has its own PVCs for vector store + logs.
storagePvc:
  storageClassName: sc-prod

logPvc:
  storageClassName: sc-prod

# Model cache PVC (BGE-M3 + reranker + docling artifacts, ~5GB filled once).
models:
  pvc:
    storageClassName: sc-prod

