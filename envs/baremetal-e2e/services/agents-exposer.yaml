serviceName: agents-exposer
componentType: agents_exposer
port: 9888

image:
  repository: gcr.io/siscale-aiops/agents-component

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

extraConfig:
  enabled: true
  name: agents-exposer-config
  mountPath: /opt/arcanna/config/agents_exposer/agents_exposer.config
  subPath: agents_exposer.config
