apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-platform-proxy
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
data:
  proxy.conf: |-
    {{- with .Values.proxy.exposer }}
    location /docs/exposer {
      rewrite ^/docs/exposer/*$ /docs break;
      proxy_pass {{ .url }};
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
    }

    location /api/v1 {
      proxy_pass {{ .url }};
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
    }

    location ~ ^/(api/v2|management)/ {
      rewrite ^/(?:api/v2|management)/(.*)$ /api/v2/$1 break;
      proxy_pass {{ .url }};
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
    }
    {{- end }}

    {{- with .Values.proxy.agentsExposer }}

    location /api/agents-exposer {
      rewrite ^/api/agents-exposer/(.*) /$1 break;
      proxy_pass {{ .url }};
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
    }

    location /docs/agents-exposer {
      rewrite ^/docs/agents-exposer(.*) /docs$1 break;
      proxy_pass {{ .url }};
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter '/api/v1/openapi.json' '/docs/agents-exposer/api/v1/openapi.json';
    }

    location /docs/agents-exposer/api/v1/openapi.json {
      proxy_pass {{ .url }}/api/v1/openapi.json;
      {{- include "aiops-platform.proxyHeaders" $ | nindent 6 }}
    }
    {{- end }}
