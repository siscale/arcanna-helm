# Kubernetes ServiceAccount that ESO authenticates as. The annotation links it to
# a GCP service account (Workload Identity), letting ESO read GCP Secret Manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-k8s-external-secrets-reader
  namespace: {{ .Release.Namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcpServiceAccount }}