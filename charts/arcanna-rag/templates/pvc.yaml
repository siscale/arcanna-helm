apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arcanna-rag-storage
  labels:
    {{- include "arcanna-rag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storagePvc.size }}
  {{- if .Values.storagePvc.storageClassName }}
  storageClassName: {{ .Values.storagePvc.storageClassName }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Model cache. Persists across image/release upgrades, so the ~5GB is
  # downloaded (or seeded) once and then only topped up with what changed.
  # See the rag-models-init container in deployment.yaml.
  name: arcanna-rag-models
  labels:
    {{- include "arcanna-rag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.models.pvc.size }}
  {{- if .Values.models.pvc.storageClassName }}
  storageClassName: {{ .Values.models.pvc.storageClassName }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arcanna-rag-log-pvc
  labels:
    {{- include "arcanna-rag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.logPvc.size }}
  {{- if .Values.logPvc.storageClassName }}
  storageClassName: {{ .Values.logPvc.storageClassName }}
  {{- end }}
